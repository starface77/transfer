[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lazystandup"
version = "0.1.0"
description = "Automated, privacy-first developer standup generator from s-git AST modifications."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "requests>=2.25.0",
    "pyperclip>=1.8.0",
    "rich>=13.0.0",
]

[project.scripts]
lazystandup = "lazystandup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
